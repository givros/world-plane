name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify WorldClaw pipeline
        run: npm run verify:worldclaw

      - name: Install desktop browser
        run: npx playwright install --with-deps chrome

      - name: Run Node regressions
        run: npm run test:node

      - name: Run desktop browser tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /world-plane/

      - name: Verify production package
        shell: bash
        env:
          VITE_BASE_PATH: /world-plane/
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4188 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node scripts/inspect-threejs-canvas.mjs \
            --url http://127.0.0.1:4188/world-plane/ \
            --out output/playwright-preview \
            --wait 500 \
            --sample-ms 500 \
            --summary

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            output/playwright
            output/playwright-preview
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
